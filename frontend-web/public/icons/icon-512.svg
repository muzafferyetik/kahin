<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <linearGradient id="crystal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="sparkle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#27272a" stroke-width="8" />

  <!-- Outer Orb Glow -->
  <circle cx="256" cy="256" r="144" fill="url(#crystal)" opacity="0.15" filter="blur(16px)" />

  <!-- Crystal Ball Body -->
  <circle cx="256" cy="256" r="128" fill="url(#crystal)" />

  <!-- Inner Reflection -->
  <path d="M 170 198 A 96 96 0 0 1 342 198 A 108 108 0 0 0 170 198 Z" fill="#ffffff" opacity="0.25" />

  <!-- Kahin "K" Monogram -->
  <path d="M 218 192 L 218 320 M 218 256 L 294 192 M 250 250 L 300 320" stroke="#ffffff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Sparkle Stars -->
  <path d="M 374 134 Q 374 160 400 160 Q 374 160 374 186 Q 374 160 348 160 Q 374 160 374 134 Z" fill="url(#sparkle)" />
  <circle cx="150" cy="362" r="10" fill="url(#sparkle)" />
</svg>
