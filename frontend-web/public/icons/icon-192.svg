<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <linearGradient id="crystal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="sparkle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="192" height="192" rx="42" fill="url(#bg)" />
  <rect x="3" y="3" width="186" height="186" rx="39" fill="none" stroke="#27272a" stroke-width="3" />

  <!-- Outer Orb Glow -->
  <circle cx="96" cy="96" r="54" fill="url(#crystal)" opacity="0.15" filter="blur(8px)" />

  <!-- Crystal Ball Body -->
  <circle cx="96" cy="96" r="48" fill="url(#crystal)" />

  <!-- Inner Reflection -->
  <path d="M 64 74 A 36 36 0 0 1 128 74 A 40 40 0 0 0 64 74 Z" fill="#ffffff" opacity="0.25" />

  <!-- Kahin "K" Monogram -->
  <path d="M 82 72 L 82 120 M 82 96 L 110 72 M 94 94 L 112 120" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Sparkle Stars -->
  <path d="M 140 50 Q 140 60 150 60 Q 140 60 140 70 Q 140 60 130 60 Q 140 60 140 50 Z" fill="url(#sparkle)" />
  <circle cx="56" cy="136" r="4" fill="url(#sparkle)" />
</svg>
